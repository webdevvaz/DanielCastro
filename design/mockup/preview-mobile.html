<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Daniel Castro — Mobile preview</title>
    <style>
      /* Shows the mockup at phone width (390 px). Browsers will not make a window that narrow. */
      html,
      body {
        margin: 0;
        background: #050404;
      }

      iframe {
        display: block;
        width: 390px;
        height: 7800px;
        border: 0;
      }
    </style>
  </head>
  <body>
    <iframe src="index.html" title="Website at phone width" scrolling="no"></iframe>
  </body>
</html>
